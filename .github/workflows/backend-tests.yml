# Runs the existing backend API test suite (backend/tests). It needs no secrets and deploys nothing.
# Python 3.11 is the minimum the README requires; 3.12 is what the Dockerfile runs in production.
name: Backend tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Actions are pinned to commit SHAs (comment = release) so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

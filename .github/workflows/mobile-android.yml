name: Mobile Android APK

# Builds the GoodNeighbour Android app (apps/mobile) on GitHub's free Linux runners and attaches the APK to the run.
# Start it from the Actions tab (Run workflow) or by pushing a change under apps/mobile.
# Optional repository secrets (Settings > Secrets and variables > Actions). Without them the app builds in local demo mode:
#   GOOGLE_SERVICES_JSON  base64 of google-services.json   (real push + Firebase Android app)
#   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID, EXPO_PUBLIC_PRIVACY_URL, EXPO_PUBLIC_ADMIN_EMAIL, EXPO_PUBLIC_ADMIN_WHATSAPP
# Run workflow with "dev" ticked to get a development build instead: the same app with a live-reload connection to a computer, so
# screens and wording can be tested on the phone without a new APK each time. Normal pushes always build the release APK.
on:
  workflow_dispatch:
    inputs:
      dev:
        description: 'Development build (live reload from a computer) instead of the release APK'
        type: boolean
        default: false
      aab:
        description: 'Signed Play Store bundle (.aab), signed with your upload key from the ANDROID_* secrets'
        type: boolean
        default: false
  push:
    branches: [feature/goodneighbour-mobile-foundation]
    paths: ['apps/mobile/**', '.github/workflows/mobile-android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_PRIVACY_URL: ${{ secrets.EXPO_PUBLIC_PRIVACY_URL }}
      EXPO_PUBLIC_ADMIN_EMAIL: ${{ secrets.EXPO_PUBLIC_ADMIN_EMAIL }}
      EXPO_PUBLIC_ADMIN_WHATSAPP: ${{ secrets.EXPO_PUBLIC_ADMIN_WHATSAPP }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licences (the runner already has the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install packages
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Add google-services.json (if provided)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json; echo "EXPO_PUBLIC_FIREBASE_ENABLED=1" >> "$GITHUB_ENV"; echo "Firebase file added"; else echo "No GOOGLE_SERVICES_JSON secret: demo-mode build"; fi

      - name: Generate the Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Prepare the upload key (only for the signed bundle)
        if: ${{ inputs.aab }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret first"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "GN_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "GN_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "GN_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "GN_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build the APK (64-bit ARM phones)
        working-directory: apps/mobile/android
        env:
          TASK: ${{ inputs.aab && 'bundleRelease' || inputs.dev && 'assembleDebug' || 'assembleRelease' }}
        run: |
          # The runner sometimes fails to download the Android NDK; a second try normally works.
          for try in 1 2; do
            ./gradlew "$TASK" -PreactNativeArchitectures=arm64-v8a --no-daemon > ../build.log 2>&1 && ok=1 && break
            grep -q "Failed to install the following SDK components" ../build.log && [ "$try" = 1 ] && echo "SDK download failed, trying once more" && continue
            break
          done
          if [ -z "${ok:-}" ]; then
            msg=$( { grep -B2 -A8 -m1 "What went wrong" ../build.log; echo "--- compiler errors ---"; grep -E "^e: |error: " ../build.log | head -8; } | cut -c1-320 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            tail -n 25 ../build.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.aab && 'goodneighbour-aab' || inputs.dev && 'goodneighbour-dev-apk' || 'goodneighbour-apk' }}
          path: ${{ inputs.aab && 'apps/mobile/android/app/build/outputs/bundle/release/*.aab' || format('apps/mobile/android/app/build/outputs/apk/{0}/*.apk', inputs.dev && 'debug' || 'release') }}
          if-no-files-found: error
